<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Repo Ask</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-button history-toggle" id="history-toggle" type="button" aria-label="Conversations" aria-controls="sidebar" aria-expanded="false">☰</button>
    <div class="brand"><span class="brand-mark" aria-hidden="true">›_</span><span>Repo Ask</span></div>
    <div class="top-actions">
      <span class="mode" id="mode" title="Connect local Ollama to generate answers"><span class="status-dot"></span><span id="mode-label">Connecting</span></span>
      <button class="button scope-button" type="button" id="show-repos" disabled>
        <span class="folder-icon" aria-hidden="true"></span>
        <span id="scope-label">Repositories</span>
      </button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <button class="button new-chat" type="button" id="new-chat" disabled><span aria-hidden="true">+</span> New conversation</button>
      <nav aria-label="Conversations">
        <h2 class="small-heading">Conversations</h2>
        <p class="history-empty" id="history-empty">Your questions will appear here.</p>
        <div id="history" class="history"></div>
      </nav>
      <div class="workspace-label" id="workspace-label"></div>
    </aside>

    <main class="conversation" aria-label="Repository question and answer">
      <div class="thread" id="thread" aria-busy="true">
        <div class="intro" id="intro">
          <div class="intro-icon" aria-hidden="true">›_</div>
          <h1>Ask your codebase</h1>
          <p id="intro-text">Loading repositories…</p>
          <div class="examples" id="examples" hidden>
            <button class="example" type="button" data-question="Trace checkout from the storefront through the orders API, database, and confirmation email.">
              <span><strong>Trace checkout</strong><small>Follow a request across four repositories</small></span><span aria-hidden="true">↗</span>
            </button>
            <button class="example" type="button" data-question="Where is the orders table defined, and which service writes to it?">
              <span><strong>Find the orders table</strong><small>Find the migration and the code that writes to it</small></span><span aria-hidden="true">↗</span>
            </button>
          </div>
        </div>
        <div class="messages" id="messages" hidden></div>
      </div>
      <form id="ask-form" class="composer">
        <label class="sr-only" for="question">Question about your repositories</label>
        <textarea id="question" name="question" rows="2" maxlength="2000" placeholder="Ask how a feature works…" required disabled></textarea>
        <div class="composer-actions">
          <span id="composer-status" role="status">Loading repositories…</span>
          <button type="submit" class="ask-button" id="ask-button" disabled>Ask <span aria-hidden="true">↑</span></button>
        </div>
      </form>
    </main>

    <aside class="inspector" id="inspector" aria-label="Source code">
      <div class="inspector-header">
        <h2>Source</h2>
        <button class="icon-button" id="close-source" type="button" aria-label="Close source" hidden>×</button>
      </div>
      <div class="inspector-empty" id="inspector-empty">
        <div class="source-icon" aria-hidden="true">[ ]</div>
        <p>Select a citation to see the code.</p>
      </div>
      <div class="source-panel" id="source-panel" hidden aria-live="polite"></div>
    </aside>
  </div>

  <dialog id="repo-dialog" aria-labelledby="repo-dialog-title">
    <form id="repo-form">
      <header class="dialog-header">
        <div>
          <h2 id="repo-dialog-title">Select repositories</h2>
          <p id="repo-dialog-help">Search and answers use the repositories you select.</p>
        </div>
        <button class="icon-button" id="close-repos" type="button" aria-label="Close repository picker">×</button>
      </header>
      <label class="sr-only" for="repo-filter">Filter repositories</label>
      <input type="search" id="repo-filter" placeholder="Filter repositories…" autocomplete="off">
      <div class="repo-options" id="repo-options" role="group" aria-label="Indexed repositories"></div>
      <footer class="dialog-actions">
        <span id="repo-count" aria-live="polite"></span>
        <button class="button" id="cancel-repos" type="button">Cancel</button>
        <button class="ask-button" type="submit" id="apply-repos">Apply</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
