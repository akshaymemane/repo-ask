[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opendevin-local"
version = "0.1.0"
description = "Self-hosted repository-aware planning and implementation workspace"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenDevin contributors" }]
keywords = ["github", "code-search", "coding-agent", "self-hosted", "pull-requests", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/akshaymemane/repo-ask"
Issues = "https://github.com/akshaymemane/repo-ask/issues"
Changelog = "https://github.com/akshaymemane/repo-ask/blob/main/CHANGELOG.md"
Security = "https://github.com/akshaymemane/repo-ask/security/policy"

[project.optional-dependencies]
credentials = ["keyring>=25.6,<26"]
github = ["cryptography>=46,<51"]
vectors = ["sqlite-vec>=0.1.9,<0.2", "apsw>=3.46,<4"]
full = ["keyring>=25.6,<26", "cryptography>=46,<51", "sqlite-vec>=0.1.9,<0.2", "apsw>=3.46,<4"]

[project.scripts]
opendevin = "repoask.__main__:main"

[tool.setuptools.packages.find]
include = ["repoask*"]

[tool.setuptools.package-data]
repoask = ["web/*", "examples/**/*"]
