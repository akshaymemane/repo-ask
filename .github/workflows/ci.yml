name: CI

on:
  push:
    branches: [main, work/opendevin-integration, 'ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[full]'
      - name: Startup probe (diagnostic)
        if: runner.os == 'macOS'
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          python - <<'PY'
          import os, select, signal, socket, subprocess, sys, time
          for args in ([], ['--data-dir', '/tmp/probe/data']):
              with socket.socket() as s:
                  s.bind(('127.0.0.1', 0)); port = s.getsockname()[1]
              t = time.time()
              p = subprocess.Popen([sys.executable, '-m', 'repoask', '--port', str(port), *args],
                                   env={**os.environ, 'PYTHONPATH': os.environ['GITHUB_WORKSPACE'], 'PYTHONFAULTHANDLER': '1'},
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              r, _, _ = select.select([p.stdout], [], [], 8)
              print(args, 'ready' if r else 'NOT READY after 8s', round(time.time() - t, 1), flush=True)
              if not r:
                  p.send_signal(signal.SIGABRT)
              else:
                  p.terminate()
              try: out, err = p.communicate(timeout=20)
              except subprocess.TimeoutExpired: p.kill(); out, err = p.communicate()
              print(out[-2000:]); print(err[-8000:], flush=True)
          PY
      - name: Unit and integration tests
        # Real Docker and Claude CLI checks stay opt-in (OPENDEVIN_DOCKER_TESTS / OPENDEVIN_SESSION_DOCKER).
        run: python -m unittest discover -s tests

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e '.[full]'
      - name: UI tests
        run: REPOASK_TEST_PYTHON="$(command -v python)" node --test tests/ui/*.test.mjs
      - name: Web asset checks
        run: python -m unittest tests.test_web_assets

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No workstation paths in tracked files
        run: |
          status=0
          git grep -nIE '/(Users|home)/[A-Za-z0-9._-]+/(workspace|projects|src|code)/' -- . ':!tests/**' ':!repoask/**' || status=$?
          if [ "$status" -eq 0 ]; then echo "::error::Replace absolute workstation paths with relative ones."; exit 1; fi
          if [ "$status" -ne 1 ]; then echo "::error::The workstation path check itself failed (git grep exit $status)."; exit "$status"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import importlib.resources as r; assert r.files('repoask').joinpath('web/index.html').is_file()"
